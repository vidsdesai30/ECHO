[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-attack-chain"
version = "0.1.0.dev0"
description = "ECHO attack chain reconstruction engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.115,<1.0",
	"pydantic>=2.9,<3.0",
	"sqlalchemy>=2.0,<3.0",
	"psycopg[binary]>=3.2,<4.0",
	"uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[project.scripts]
echo = "echo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
